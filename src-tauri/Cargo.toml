[package]
name = "gitter"
version = "1.0.0"
description = "Gitter - High-Performance Git GUI with AI and Virtual Branches"
authors = ["Zhiko Mitov <zhikom@gmail.com>"]
edition = "2021"

[lib]
name = "gitter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
