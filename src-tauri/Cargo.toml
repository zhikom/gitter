[package]
name = "gitter"
version = "1.3.0"
description = "Gitter - High-Performance Git GUI with AI and Virtual Branches"
authors = ["Zhiko Mitov <zhikom@gmail.com>"]
edition = "2021"

[lib]
name = "gitter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
