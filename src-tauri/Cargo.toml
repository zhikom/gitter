[package]
name = "gitter"
version = "1.6.1"
description = "Gitter - High-Performance Git GUI with AI and Virtual Branches"
authors = ["Zhiko Mitov <zhikom@gmail.com>"]
edition = "2021"

[lib]
name = "gitter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy", "query"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "encryption", "getrandom"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
