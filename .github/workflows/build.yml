name: "CI / Multi-Platform Build Artifacts"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    name: Build (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'Windows x64'
            artifact_name: 'gitter-windows-x64'
            os: 'windows'
            args: ''
          - platform: 'macos-latest'
            name: 'macOS Universal'
            artifact_name: 'gitter-macos-universal'
            os: 'macos'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            name: 'Linux x64'
            artifact_name: 'gitter-linux-x64'
            os: 'linux'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev || true

      - name: Install frontend dependencies
        run: npm ci

      # Build with tauri-action (with release publishing when pushing tags)
      - name: Build Tauri App (Release Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Gitter v__VERSION__'
          releaseBody: 'See the release assets below to download Gitter for your platform.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Build with tauri-action (without release publishing on normal push/PR)
      - name: Build Tauri App (CI Build)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # Upload Artifacts: Windows
      - name: Upload Windows Artifacts
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/gitter.exe
          if-no-files-found: warn

      # Upload Artifacts: macOS
      - name: Upload macOS Artifacts
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app
          if-no-files-found: warn

      # Upload Artifacts: Linux
      - name: Upload Linux Artifacts
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  build-vscode-extension:
    name: Build (VS Code Extension)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run vscode:build

      - name: Package VSIX
        run: |
          cd extensions/vscode
          npx @vscode/vsce package --no-git-tag-version --no-update-package-json -o gitter-vscode.vsix

      - name: Upload VS Code Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitter-vscode-extension
          path: extensions/vscode/gitter-vscode.vsix
          if-no-files-found: error
