<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
  <title id="title">Pull request review</title><desc id="desc">A sample pull request with a file list, review agent, diff, inline comment, checks, and approve button.</desc>
  <rect width="1100" height="570" rx="16" fill="#10151e"/>
  <rect x="20" y="20" width="1060" height="530" rx="12" fill="#1b212c" stroke="#344153"/>
  <path d="M20 88H1080M20 137H1080M245 137V550" stroke="#344153"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="45" y="50" fill="#eef2f7" font-size="19" font-weight="700">#7 Improve calculation</text><text x="45" y="72" fill="#9eacc0" font-size="13">demo · feature → main</text>
    <rect x="935" y="42" width="105" height="30" rx="6" fill="#276d67"/><text x="955" y="62" fill="#fff" font-size="13">✓ Approve</text>
    <text x="45" y="119" fill="#8fded4" font-size="14">Changes</text><text x="133" y="119" fill="#a7b4c4" font-size="14">Discussion (2)</text><text x="258" y="119" fill="#a7b4c4" font-size="14">Checks (2)</text>
    <text x="40" y="165" fill="#9eacc0" font-size="13">Changed files</text><rect x="33" y="177" width="198" height="33" rx="5" fill="#26364a"/><text x="44" y="198" fill="#bcece5" font-size="13">src/math.js</text>
    <path d="M40 226H225" stroke="#344153"/><text x="40" y="254" fill="#e2e8f0" font-size="14" font-weight="700">Local agent review</text><text x="40" y="278" fill="#a7b4c4" font-size="12">Choose a CLI to draft</text><text x="40" y="297" fill="#a7b4c4" font-size="12">comments for your review.</text>
    <rect x="40" y="312" width="170" height="31" rx="5" fill="#202a38" stroke="#43526a"/><text x="52" y="332" fill="#e2e8f0" font-size="13">Codex CLI ▾</text><rect x="40" y="352" width="170" height="31" rx="5" fill="#202a38" stroke="#43526a"/><text x="52" y="372" fill="#e2e8f0" font-size="13">✦ Review with agent</text>
    <text x="267" y="165" fill="#d5dfeb" font-family="monospace" font-size="13">src/math.js</text><rect x="246" y="178" width="833" height="28" fill="#22334b"/><text x="268" y="197" fill="#8ab5ec" font-family="monospace" font-size="13">@@ -1,3 +1,3 @@</text>
    <text x="267" y="230" fill="#a7b4c4" font-family="monospace" font-size="13">⊕  1  1   export function divide(a, b) {</text><rect x="246" y="241" width="833" height="28" fill="#45282f"/><text x="267" y="260" fill="#f3b1b4" font-family="monospace" font-size="13">⊕  2     −   return a / b;</text><rect x="246" y="270" width="833" height="28" fill="#183c36"/><text x="267" y="289" fill="#a9e7cc" font-family="monospace" font-size="13">⊕     2  +   return a * b;</text>
    <rect x="321" y="312" width="600" height="82" rx="6" fill="#161d28" stroke="#41516a"/><text x="337" y="337" fill="#8fded4" font-size="13">reviewer</text><text x="337" y="361" fill="#e2e8f0" font-size="13">Should this divide the inputs instead?</text><text x="267" y="421" fill="#a7b4c4" font-family="monospace" font-size="13">⊕  3  3   }</text>
    <text x="44" y="509" fill="#94a3b8" font-size="12">Suggestions are drafts</text><text x="44" y="527" fill="#94a3b8" font-size="12">until you post them.</text>
  </g>
</svg>
