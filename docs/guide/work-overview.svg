<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Work overview</title>
  <desc id="desc">A sample Work overview showing repositories and branch states on the left, and Git status, sessions and AI summary on the right.</desc>
  <rect width="1100" height="560" rx="18" fill="#101722"/>
  <rect x="20" y="20" width="1060" height="520" rx="14" fill="#1b212c" stroke="#344154"/>
  <text x="46" y="54" fill="#d8e4f1" font-family="system-ui,sans-serif" font-size="19" font-weight="700">Work overview</text>
  <text x="46" y="76" fill="#9eafc2" font-family="system-ui,sans-serif" font-size="12">Local work across repositories, branches and worktrees</text>
  <rect x="904" y="35" width="72" height="30" rx="7" fill="#263342"/><text x="917" y="55" fill="#d8e4f1" font-family="system-ui,sans-serif" font-size="12">Refresh</text>
  <rect x="985" y="35" width="68" height="30" rx="7" fill="#263342"/><text x="1000" y="55" fill="#d8e4f1" font-family="system-ui,sans-serif" font-size="12">Folder</text>
  <line x1="20" y1="94" x2="1080" y2="94" stroke="#344154"/>
  <line x1="390" y1="94" x2="390" y2="540" stroke="#344154"/>
  <rect x="38" y="112" width="220" height="30" rx="6" fill="#111722" stroke="#344154"/><text x="51" y="132" fill="#8295aa" font-family="system-ui,sans-serif" font-size="12">Search repositories or branches…</text>
  <rect x="270" y="112" width="100" height="30" rx="6" fill="#111722" stroke="#344154"/><text x="282" y="132" fill="#c8d6e5" font-family="system-ui,sans-serif" font-size="12">All work ▾</text>
  <rect x="22" y="160" width="367" height="30" fill="#263342"/><text x="42" y="180" fill="#b9ccdc" font-family="system-ui,sans-serif" font-size="12" font-weight="700">example-project · 2</text>
  <rect x="22" y="190" width="367" height="80" fill="#1c3b3d"/><rect x="22" y="190" width="3" height="80" fill="#5eead4"/>
  <text x="43" y="213" fill="#e2edf6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">⑂ feature/search</text>
  <text x="61" y="233" fill="#9eafc2" font-family="system-ui,sans-serif" font-size="11">~/repos/example-project-search</text>
  <text x="61" y="253" fill="#f6c985" font-family="system-ui,sans-serif" font-size="11">1 staged · 2 unstaged · 1 untracked</text>
  <text x="43" y="295" fill="#d8e4f1" font-family="system-ui,sans-serif" font-size="13">⑂ main</text>
  <text x="61" y="315" fill="#9eafc2" font-family="system-ui,sans-serif" font-size="11">~/repos/example-project · Clean</text>
  <text x="415" y="126" fill="#e2edf6" font-family="system-ui,sans-serif" font-size="16" font-weight="700">⑂ feature/search</text>
  <text x="415" y="146" fill="#9eafc2" font-family="system-ui,sans-serif" font-size="11">~/repos/example-project-search</text>
  <rect x="878" y="112" width="160" height="30" rx="7" fill="#0d9e8d"/><text x="904" y="132" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Open worktree</text>
  <rect x="410" y="166" width="645" height="111" rx="8" fill="#151d28" stroke="#344154"/>
  <text x="428" y="188" fill="#9eafc2" font-family="system-ui,sans-serif" font-size="11" font-weight="700">GIT STATUS</text>
  <text x="428" y="211" fill="#d8e4f1" font-family="system-ui,sans-serif" font-size="12">Working directory: 1 staged, 2 unstaged, 1 untracked</text>
  <text x="428" y="232" fill="#d8e4f1" font-family="system-ui,sans-serif" font-size="12">Upstream: origin/main ↑2 ↓0</text>
  <text x="735" y="232" fill="#d8e4f1" font-family="system-ui,sans-serif" font-size="12">Absent from fetched origin: 1</text>
  <text x="428" y="254" fill="#8295aa" font-family="system-ui,sans-serif" font-size="11">Remote counts use local refs from the last fetch.</text>
  <rect x="410" y="290" width="645" height="94" rx="8" fill="#151d28" stroke="#344154"/>
  <text x="428" y="313" fill="#9eafc2" font-family="system-ui,sans-serif" font-size="11" font-weight="700">CODEX &amp; CLAUDE SESSIONS</text>
  <text x="428" y="336" fill="#d8e4f1" font-family="system-ui,sans-serif" font-size="12">Codex · Possible match · feature/search</text>
  <text x="428" y="358" fill="#8295aa" font-family="system-ui,sans-serif" font-size="11">Continue in desktop · Link to worktree · Copy terminal resume</text>
  <rect x="410" y="397" width="645" height="116" rx="8" fill="#151d28" stroke="#344154"/>
  <text x="428" y="420" fill="#9eafc2" font-family="system-ui,sans-serif" font-size="11" font-weight="700">AI WORK SUMMARY</text>
  <text x="428" y="443" fill="#d8e4f1" font-family="system-ui,sans-serif" font-size="12">Summarize Git evidence; optionally include a verified session.</text>
  <text x="428" y="466" fill="#8295aa" font-family="system-ui,sans-serif" font-size="11">Completed or in progress · Remaining · Next steps · Uncertainties</text>
  <rect x="428" y="478" width="140" height="24" rx="6" fill="#0d9e8d"/><text x="443" y="495" fill="#fff" font-family="system-ui,sans-serif" font-size="11">Summarize work</text>
</svg>
