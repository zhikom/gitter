<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Gitter workspace</title>
  <desc id="desc">A sample Gitter window with numbered tabs, toolbar, navigator, commit graph, working tree, and commit panel.</desc>
  <rect width="1200" height="660" rx="18" fill="#10141b"/>
  <rect x="14" y="12" width="210" height="38" rx="7" fill="#202735"/><text x="34" y="37" font-family="system-ui" font-size="15" fill="#edf3fa">sample-project</text><text x="160" y="37" font-family="system-ui" font-size="12" fill="#9cd9ca">main</text>
  <rect x="0" y="55" width="1200" height="58" fill="#1b212c"/>
  <g font-family="system-ui" font-size="13" fill="#e2e8f0">
    <rect x="20" y="68" width="155" height="32" rx="6" fill="#293549"/><text x="34" y="89">sample-project</text>
    <rect x="188" y="68" width="76" height="32" rx="6" fill="#293549"/><text x="211" y="89">Pull</text>
    <rect x="272" y="68" width="76" height="32" rx="6" fill="#293549"/><text x="293" y="89">Push</text>
    <rect x="356" y="68" width="91" height="32" rx="6" fill="#293549"/><text x="376" y="89">Branch</text>
    <rect x="455" y="68" width="80" height="32" rx="6" fill="#293549"/><text x="475" y="89">Stash</text>
    <rect x="543" y="68" width="79" height="32" rx="6" fill="#293549"/><text x="565" y="89">Undo</text>
    <rect x="846" y="68" width="130" height="32" rx="6" fill="#293549"/><text x="865" y="89">Open in…</text>
    <rect x="985" y="68" width="93" height="32" rx="6" fill="#293549"/><text x="1005" y="89">Search</text>
    <rect x="1087" y="68" width="93" height="32" rx="6" fill="#293549"/><text x="1105" y="89">Settings</text>
  </g>
  <rect x="14" y="128" width="250" height="514" rx="7" fill="#181d26" stroke="#344257"/>
  <rect x="277" y="128" width="485" height="514" rx="7" fill="#14181f" stroke="#344257"/>
  <rect x="775" y="128" width="410" height="310" rx="7" fill="#181d26" stroke="#344257"/>
  <rect x="775" y="450" width="410" height="192" rx="7" fill="#1b212c" stroke="#344257"/>
  <g font-family="system-ui" fill="#aebbd0" font-size="13">
    <text x="32" y="156" font-weight="700">NAVIGATOR</text><rect x="31" y="169" width="215" height="30" rx="5" fill="#10141b" stroke="#344257"/><text x="43" y="189" fill="#78889c">Filter branches, tags…</text>
    <text x="32" y="230" fill="#c7d3e1">⌄  LOCAL BRANCHES</text><text x="50" y="260">feature/welcome</text><rect x="24" y="271" width="232" height="30" fill="#173c39"/><text x="50" y="291" fill="#82e2cf">✓  main</text>
    <text x="32" y="334">⌄  REMOTE BRANCHES</text><text x="50" y="363">main</text><text x="32" y="408">⌄  PULL REQUESTS</text><text x="50" y="437">#42  Improve welcome</text><text x="32" y="482">›  TAGS</text><text x="32" y="520">›  STASHES</text>
    <text x="294" y="156" font-weight="700">COMMIT GRAPH</text><text x="525" y="156" fill="#77889b">Search commits…</text>
    <text x="798" y="156" font-weight="700">WORKING TREE FILES</text><text x="798" y="195" fill="#8cddc3">STAGED  (1)</text><text x="818" y="225">M   README.md</text><text x="798" y="273" fill="#eabf75">UNSTAGED  (1)</text><text x="818" y="303">M   src/welcome.ts</text><text x="798" y="480" font-weight="700">COMMIT CHANGES</text>
  </g>
  <g stroke-width="3" fill="none"><path d="M320 196 V359" stroke="#18b487"/><path d="M320 235 C320 258 350 258 350 281 V318" stroke="#5c94ef"/></g>
  <g fill="#18b487"><circle cx="320" cy="196" r="5"/><circle cx="320" cy="235" r="5"/><circle cx="320" cy="359" r="5"/></g><g fill="#5c94ef"><circle cx="350" cy="281" r="5"/><circle cx="350" cy="318" r="5"/></g>
  <g font-family="system-ui" font-size="14" fill="#d8e0ea"><text x="380" y="201">Uncommitted changes</text><text x="380" y="240">Merge welcome improvements</text><text x="380" y="286">Improve the welcome message</text><text x="380" y="323">Expand project guide</text><text x="380" y="364">Create the sample project</text></g>
  <rect x="797" y="497" width="366" height="34" rx="5" fill="#10141b" stroke="#344257"/><text x="810" y="519" font-family="system-ui" font-size="13" fill="#8999af">Commit summary…</text><rect x="1024" y="575" width="140" height="40" rx="6" fill="#168a73"/><text x="1046" y="601" font-family="system-ui" font-size="13" fill="#fff">Commit to main</text>
  <g font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle"><g fill="#f6c873"><circle cx="230" cy="30" r="14"/><circle cx="652" cy="84" r="14"/><circle cx="240" cy="143" r="14"/><circle cx="738" cy="143" r="14"/><circle cx="1160" cy="143" r="14"/><circle cx="1160" cy="470" r="14"/></g><g fill="#17202a"><text x="230" y="35">1</text><text x="652" y="89">2</text><text x="240" y="148">3</text><text x="738" y="148">4</text><text x="1160" y="148">5</text><text x="1160" y="475">6</text></g></g>
</svg>
